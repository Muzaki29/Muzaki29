name: Update profile art

"on":
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh-profile-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Fetch public contribution data
        env:
          GH_PROFILE_USER: Muzaki29
        run: python scripts/fetch_contributions.py
      - name: Render animated contribution graph and statistics
        run: |
          python scripts/render_heatmap_svg.py
          python scripts/render_stats_svg.py
      - name: Commit refreshed artwork
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile contribution art [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg stats.svg"
